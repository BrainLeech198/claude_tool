# 把 website/ 发布成 GitHub Pages。
#
# 为什么走 Actions 而不是「Deploy from a branch」：那个方式的源目录只能选仓库根
# （/）或者 /docs，中间没有别的选项。官网单独放 website/，就只能由 Actions 把
# 这个目录当产物传上去。发布源要选成 GitHub Actions（build_type=workflow）。
#
# 仓库本身是 Gitee 的镜像，这边只负责展示——源码和安装包都在 Gitee 上。
name: 发布官网

on:
  # 分支名跟 Gitee 那边对齐：镜像推过来的是 master，盯 main 的话一次都不会触发。
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement 那句是给还没开过 Pages 的仓库用的：第一次跑的时候顺手把它打开。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deploy
        uses: actions/deploy-pages@v4
